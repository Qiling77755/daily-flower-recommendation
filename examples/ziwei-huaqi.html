<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日一花 · 花期剧场 —— 紫薇</title>
<!--
  ═══════════════════════════════════════════════════════════════
  每日一花 · 创意模板 B 「花期」物候剧场
  ───────────────────────────────────────────────────────────────
  核心概念：花是物候的钟。认识一种花 = 陪它过完一年。
  页面是一座小剧场：唯一的主角是那棵树，唯一的导演是时间。
  底部 24 节气日晷是唯一导航——拖动太阳，树随节气开落，
  天色、地色、观察笔记与应季诗句整体呼吸。

  数据契约：幕后册页内容渲染自 FLOWER 对象（映射 SKILL.md 十二模块）；
  TERMS 为本模板特有的「节气物候」数组（24 项，含树的状态参数
  leaf/bud/bloom、天色 sky、地色 ground、观察语、可为、应季诗）。
  复用方法：替换 FLOWER 与 TERMS 即可生成新花卉的一年。
  插图 SVG（id=scene）由 Skill 按花卉重绘，保留 viewBox="0 0 680 500"，
  并保留 .fol（叶簇组）、.blm（花簇组）、.bud（芽簇组）、#skyTop/#skyBot/#ground
  等挂点；若缺失，剧场将静默降级为纯文字版物候（幕后册页自动兜底全部档案内容）。

  运行方式：双击本文件直接在浏览器打开（file://，无任何外部依赖）。
  ═══════════════════════════════════════════════════════════════
-->
<style>
  :root{
    --paper:#f5f1e4;
    --ink:#33301f;
    --ink-soft:#6b6550;
    --ink-faint:#97907a;
    --rule:#c9c0a4;
    --cinnabar:#a04326;
    --crimson:#94496b;
    --crimson-deep:#713653;
    --kai:"Kaiti SC","STKaiti","KaiTi","DFKai-SB",serif;
    --song:"Songti SC","STSong","NSimSun","SimSun","Noto Serif SC",serif;
    --latin:Georgia,"Times New Roman",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--song);color:var(--ink);line-height:1.9;
    background:var(--paper);
    min-height:100vh;
  }
  ::selection{background:rgba(148,73,107,.22)}

  /* ── 顶栏 ─────────────────────────────── */
  .top{
    display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;
    max-width:1120px;margin:0 auto;padding:26px 22px 6px;
  }
  .top .brand{font-family:var(--kai);letter-spacing:.3em;font-size:15px;color:var(--ink-soft)}
  .top .brand b{color:var(--crimson-deep);font-weight:400}
  .top .who{font-size:12px;color:var(--ink-faint);letter-spacing:.12em}
  .top .who i{font-family:var(--latin)}

  /* ── 剧场 ─────────────────────────────── */
  .theater{max-width:1120px;margin:0 auto;padding:10px 22px 0}
  .stage{
    position:relative;margin:0 auto;
    width:min(100%,calc((100svh - 300px)*1.36));
    min-width:min(100%,560px);
    aspect-ratio:680/500;
    border:1px solid rgba(80,66,40,.35);
    box-shadow:0 20px 60px -18px rgba(60,50,25,.35);
    overflow:hidden;
  }
  .stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* 观察手记卡 */
  .note-card{
    position:absolute;left:20px;bottom:20px;width:min(340px,62%);
    background:rgba(247,243,230,.94);
    border:1px solid rgba(105,92,60,.4);
    box-shadow:0 10px 30px -10px rgba(50,40,15,.4);
    padding:16px 18px 14px;z-index:3;
  }
  .note-card::before{
    content:"物候手记";position:absolute;top:-10px;left:14px;
    font-family:var(--kai);font-size:11px;letter-spacing:.4em;text-indent:.4em;
    color:var(--cinnabar);background:#f7f3e6;padding:0 8px;
  }
  .nc-term{display:flex;align-items:baseline;gap:10px}
  .nc-term .t-name{font-family:var(--kai);font-size:26px;letter-spacing:.2em;color:var(--ink)}
  .nc-term .t-date{font-size:11.5px;color:var(--ink-faint);letter-spacing:.06em}
  .nc-observe{font-size:13px;color:var(--ink-soft);margin-top:8px;text-align:justify}
  .nc-do{font-size:12.5px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule)}
  .nc-do b{font-family:var(--kai);font-weight:400;color:var(--cinnabar);letter-spacing:.2em;margin-right:8px}
  .nc-poem{
    margin-top:10px;padding:10px 12px;border-left:2px solid var(--crimson);
    background:rgba(148,73,107,.06);
    opacity:0;transform:translateY(6px);transition:opacity .8s,transform .8s;
    font-family:var(--kai);
  }
  .nc-poem.show{opacity:1;transform:none}
  .nc-poem .pl{font-size:13.5px;letter-spacing:.12em;line-height:2}
  .nc-poem .pa{font-size:11px;color:var(--ink-faint);text-align:right;letter-spacing:.1em;margin-top:2px}

  /* 日晷控制 */
  .sundial{
    max-width:860px;margin:18px auto 0;padding:0 22px;
    display:flex;flex-direction:column;gap:10px;
  }
  .dial-track{
    position:relative;height:64px;user-select:none;touch-action:none;cursor:pointer;
  }
  .dial-rail{position:absolute;left:0;right:0;top:30px;height:2px;background:var(--rule)}
  .dial-ticks{position:absolute;inset:0}
  .dial-tick{
    position:absolute;top:22px;width:1px;height:18px;background:var(--rule);
    transform:translateX(-.5px);
  }
  .dial-tick.major{top:18px;height:26px;background:#a89e7e}
  .dial-tick .t-label{
    position:absolute;top:-22px;left:50%;transform:translateX(-50%);
    font-family:var(--kai);font-size:11px;letter-spacing:.08em;color:var(--ink-faint);
    white-space:nowrap;transition:color .3s;
  }
  .dial-tick .t-label.duo{color:#b3aa8c}
  .dial-tick.cur .t-label{color:var(--cinnabar);font-size:13px}
  .dial-sun{
    position:absolute;top:31px;width:26px;height:26px;border-radius:50%;
    transform:translate(-50%,-50%);cursor:grab;
    background:radial-gradient(circle at 38% 35%,#f6e3a8,#e5b95c 62%,#c98f36);
    box-shadow:0 0 0 4px rgba(229,185,92,.25),0 2px 8px rgba(150,110,40,.4);
    z-index:2;
  }
  .dial-sun:active{cursor:grabbing}
  .dial-ui{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
  .dial-btn{
    font-family:var(--kai);font-size:13px;letter-spacing:.25em;text-indent:.25em;
    background:none;border:1px solid var(--rule);color:var(--ink-soft);
    padding:6px 16px;cursor:pointer;transition:.25s;
  }
  .dial-btn:hover{border-color:var(--cinnabar);color:var(--cinnabar)}
  .dial-hint{font-size:11px;color:var(--ink-faint);letter-spacing:.1em}
  .dial-progress{font-size:11px;color:var(--ink-faint);letter-spacing:.15em}

  /* ── 幕后册页（滑入覆盖层） ─────────────── */
  .scrim{
    position:fixed;inset:0;background:rgba(45,40,24,.4);z-index:39;
    opacity:0;pointer-events:none;transition:opacity .45s;
  }
  .scrim.on{opacity:1;pointer-events:auto}
  .backstage{
    position:fixed;top:0;right:0;bottom:0;width:min(600px,94vw);z-index:40;
    background:var(--paper);
    box-shadow:-24px 0 70px rgba(30,24,8,.35);
    transform:translateX(105%);transition:transform .55s cubic-bezier(.7,0,.2,1);
    overflow-y:auto;padding:34px 38px 60px;
  }
  .backstage.on{transform:none}
  .bs-head{text-align:center;position:relative;margin-bottom:10px}
  .bs-head .ph-mark{font-size:11px;letter-spacing:.6em;text-indent:.6em;color:var(--ink-faint)}
  .bs-head h2{font-family:var(--kai);font-weight:400;font-size:25px;letter-spacing:.3em;text-indent:.3em;margin-top:6px}
  .bs-head .ph-sub{font-size:12px;color:var(--ink-faint);letter-spacing:.15em;margin-top:4px}
  .bs-head .ph-sub i{font-family:var(--latin)}
  .bs-close{
    position:absolute;top:0;right:0;font-family:var(--kai);font-size:12px;
    letter-spacing:.15em;background:none;border:1px solid var(--rule);color:var(--ink-soft);
    padding:6px 12px;cursor:pointer;transition:.25s;
  }
  .bs-close:hover{border-color:var(--cinnabar);color:var(--cinnabar)}
  .pg-sec{margin-top:40px}
  .pg-sec h3{
    font-family:var(--kai);font-weight:400;font-size:17px;letter-spacing:.3em;
    display:flex;align-items:baseline;gap:12px;margin-bottom:14px;
  }
  .pg-sec h3 .sn{font-size:11px;color:var(--cinnabar);border:1px solid rgba(160,67,38,.4);padding:1px 7px;letter-spacing:.15em;white-space:nowrap;transform:translateY(-2px)}
  .pg-sec h3::after{content:"";flex:1;height:1px;background:var(--rule)}

  table.arch{width:100%;border-collapse:collapse;font-size:13.5px;border-top:2px solid var(--ink-soft);border-bottom:2px solid var(--ink-soft)}
  table.arch th{font-family:var(--kai);font-weight:400;text-align:left;width:6.5em;padding:9px 12px 9px 2px;color:var(--cinnabar);letter-spacing:.3em;border-bottom:1px solid var(--rule);vertical-align:top}
  table.arch td{padding:9px 2px;border-bottom:1px solid var(--rule);vertical-align:top}
  table.arch tr:last-child th,table.arch tr:last-child td{border-bottom:none}
  table.arch i{font-family:var(--latin)}

  .twocol{columns:2;column-gap:44px;column-rule:1px solid var(--rule);font-size:13.5px}
  .twocol p{break-inside:avoid;margin-bottom:10px;text-align:justify}
  .twocol b{font-family:var(--kai);font-weight:400;color:var(--crimson-deep);letter-spacing:.1em}

  .kin{display:flex;gap:1px;border:1px solid var(--rule);background:var(--rule);margin-bottom:1px}
  .kin>div{flex:1;background:var(--paper);padding:14px 16px;font-size:12.5px}
  .kin .kn{font-family:var(--kai);font-size:16px;letter-spacing:.15em;color:var(--crimson-deep)}
  .kin .kl{font-family:var(--latin);font-style:italic;font-size:11px;color:var(--ink-faint);display:block;margin:2px 0 8px}
  .kin p{color:var(--ink-soft);line-height:1.85}
  table.cmp{width:100%;border-collapse:collapse;font-size:12.5px}
  table.cmp th{font-family:var(--kai);font-weight:400;background:var(--ink-soft);color:var(--paper);padding:7px 10px;text-align:left;letter-spacing:.15em}
  table.cmp td{padding:7px 10px;border:1px solid var(--rule);vertical-align:top;color:var(--ink-soft)}
  table.cmp td:first-child{font-family:var(--kai);color:var(--ink);white-space:nowrap}
  table.cmp i{font-family:var(--latin)}

  .mnem{font-family:var(--kai);font-size:16.5px;letter-spacing:.2em;line-height:2.5;color:var(--cinnabar);text-align:center;padding:22px 0 16px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .recog{list-style:none;font-size:13.5px}
  .recog li{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--rule);align-items:baseline}
  .recog li:last-child{border-bottom:none}
  .recog li::before{content:"▸";color:var(--cinnabar);font-size:11px}
  .recog b{font-family:var(--kai);font-weight:400;letter-spacing:.08em}

  .pheno{border:1px solid var(--rule);padding:16px 20px;font-size:13px;color:var(--ink-soft)}
  .pheno .loc{font-family:var(--kai);letter-spacing:.2em;color:var(--crimson-deep);margin-bottom:6px}
  .pheno ul{list-style:none;margin-top:6px}
  .pheno li{padding:2px 0}
  .pheno li::before{content:"◦ ";color:var(--cinnabar)}

  .prog-foot{margin-top:56px;text-align:center;font-size:11px;color:var(--ink-faint);letter-spacing:.2em}

  /* 花瓣粒子 */
  .petal{position:absolute;pointer-events:none;z-index:2}

  /* ── 窄屏 ─────────────────────────────── */
  @media (max-width:720px){
    .theater{padding:6px 10px 0}
    .stage{width:100%;min-width:0;aspect-ratio:680/500}
    .note-card{left:8px;right:8px;bottom:8px;width:auto;max-height:52%;overflow-y:auto;padding:10px 12px 8px}
    .nc-observe{font-size:12px;margin-top:6px}
    .nc-do{font-size:11.5px;margin-top:6px;padding-top:6px}
    .nc-poem{font-size:12px;padding:8px 10px;margin-top:8px}
    .nc-poem .pl{font-size:12px;line-height:1.9}
    .nc-term .t-name{font-size:20px}
    .dial-tick .t-label{font-size:9px;top:-18px}
    .dial-tick.cur .t-label{font-size:11px}
    .twocol{columns:1}
    .kin{flex-direction:column}
    .top{padding:18px 12px 4px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

<div class="top">
  <div class="brand">每日一花 · <b>花期剧场</b></div>
  <div class="who">紫薇 <i>Lagerstroemia indica</i> · 陪它过完一年</div>
</div>

<div class="theater">
  <div class="stage" id="stage">
    <svg id="scene" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="紫薇物候剧场：一棵随节气开落的紫薇树">
      <defs>
        <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
          <stop id="skyTop" offset="0" stop-color="#d7edda"/>
          <stop id="skyBot" offset="1" stop-color="#eef3df"/>
        </linearGradient>
        <path id="leafB" d="M0 0 C 7 -13, 24 -20, 37 -15 C 44 -12, 43 -3, 33 2 C 19 9, 5 6, 0 0 Z"/>
        <g id="petalB">
          <path d="M0 0 C -2 -10, -4 -16, -7 -22 Q -9.5 -27 -6 -28.5 Q -3 -29.5 -1.6 -25.5 Q 0 -30.5 1.6 -25.5 Q 3 -29.5 6 -28.5 Q 9.5 -27 7 -22 C 4 -16, 2 -10, 0 0 Z"/>
        </g>
        <g id="flowerB">
          <use href="#petalB" fill="#b34a75" stroke="#7c3054" stroke-width=".5"/>
          <use href="#petalB" transform="rotate(60)" fill="#c2618a" stroke="#7c3054" stroke-width=".5"/>
          <use href="#petalB" transform="rotate(120)" fill="#b34a75" stroke="#7c3054" stroke-width=".5"/>
          <use href="#petalB" transform="rotate(180)" fill="#c2618a" stroke="#7c3054" stroke-width=".5"/>
          <use href="#petalB" transform="rotate(240)" fill="#b34a75" stroke="#7c3054" stroke-width=".5"/>
          <use href="#petalB" transform="rotate(300)" fill="#c2618a" stroke="#7c3054" stroke-width=".5"/>
          <circle r="4" fill="#e3c25f" stroke="#a8842f" stroke-width=".5"/>
        </g>
        <g id="budB">
          <ellipse rx="4" ry="6.6" cy="-1" fill="#a63b5c" stroke="#6e2440" stroke-width=".5"/>
          <path d="M0 5 L0 9" stroke="#5f7a45" stroke-width="1"/>
        </g>
      </defs>

      <rect width="680" height="500" fill="url(#skyG)"/>
      <rect id="ground" y="428" width="680" height="72" fill="#97b47a"/>
      <path id="groundEdge" d="M0 428 L680 428" stroke="#7d9a60" stroke-width="2" opacity=".5"/>

      <!-- 树（干瘦、冠丰、垂枝） -->
      <g id="tree">
        <!-- 干（光滑） -->
        <path d="M326 442 C 328 404, 326 364, 329 324 C 331 298, 333 282, 335 270 L 351 270 C 353 284, 356 302, 359 328 C 362 366, 362 406, 363 442 Z"
              fill="#8a7256" stroke="#5f4c36" stroke-width="1"/>
        <path d="M336 300 C 335 340, 334 390, 335 434" stroke="#a8946e" stroke-width="1.2" fill="none" opacity=".7"/>
        <!-- 枝 -->
        <g fill="#8a7256" stroke="#5f4c36" stroke-width="1">
          <path d="M335 270 C 321 240, 301 212, 275 192 C 257 178, 237 168, 219 162 L 225 150 C 247 156, 269 168, 289 186 C 311 206, 327 234, 337 262 Z"/>
          <path d="M351 270 C 361 242, 377 218, 399 200 C 415 188, 433 178, 449 174 L 445 162 C 425 166, 403 178, 385 196 C 363 218, 347 246, 341 264 Z"/>
          <path d="M341 278 C 339 248, 337 218, 331 194 C 327 180, 321 166, 315 156 L 327 150 C 335 162, 341 176, 345 192 C 351 216, 353 248, 353 274 Z"/>
          <path d="M251 160 C 239 148, 229 132, 225 114 L 237 110 C 241 126, 249 140, 259 152 Z"/>
          <path d="M447 170 C 457 160, 465 146, 469 130 L 481 134 C 477 150, 467 166, 457 174 Z"/>
          <path d="M301 238 C 287 250, 269 258, 249 260 L 249 250 C 265 248, 279 242, 291 232 Z"/>
          <path d="M391 234 C 403 246, 419 254, 437 256 L 435 266 C 419 264, 403 256, 391 246 Z"/>
        </g>

        <!-- 叶簇（内→外排序，春由内向外展开） -->
        <g id="foliage" fill="#5b7246" stroke="#41552f" stroke-width=".7">
          <g class="fol" transform="translate(332 260)"><use href="#leafB" transform="rotate(-30)"/><use href="#leafB" transform="rotate(150) scale(.9)"/><use href="#leafB" transform="translate(8 -6) rotate(-70) scale(.8)"/></g>
          <g class="fol" transform="translate(304 216)"><use href="#leafB" transform="rotate(-40)"/><use href="#leafB" transform="translate(6 4) rotate(140) scale(.85)"/></g>
          <g class="fol" transform="translate(384 218)"><use href="#leafB" transform="rotate(30)"/><use href="#leafB" transform="translate(-6 2) rotate(200) scale(.85)"/></g>
          <g class="fol" transform="translate(338 192)"><use href="#leafB" transform="rotate(-80) scale(.9)"/><use href="#leafB" transform="translate(10 4) rotate(-20) scale(.8)"/></g>
          <g class="fol" transform="translate(258 174)"><use href="#leafB" transform="rotate(-30)"/><use href="#leafB" transform="rotate(150) scale(.85)"/><use href="#leafB" transform="translate(10 -2) rotate(-60) scale(.7)"/></g>
          <g class="fol" transform="translate(418 184)"><use href="#leafB" transform="rotate(36)"/><use href="#leafB" transform="translate(-8 4) rotate(210) scale(.8)"/></g>
          <g class="fol" transform="translate(228 140)"><use href="#leafB" transform="rotate(-46) scale(.9)"/><use href="#leafB" transform="translate(8 6) rotate(130) scale(.75)"/></g>
          <g class="fol" transform="translate(450 146)"><use href="#leafB" transform="rotate(20) scale(.95)"/><use href="#leafB" transform="translate(-10 2) rotate(160) scale(.8)"/></g>
          <g class="fol" transform="translate(286 144)"><use href="#leafB" transform="rotate(-64) scale(.85)"/><use href="#leafB" transform="translate(12 8) rotate(-8) scale(.7)"/></g>
          <g class="fol" transform="translate(396 132)"><use href="#leafB" transform="rotate(-14) scale(.85)"/><use href="#leafB" transform="translate(-12 8) rotate(190) scale(.7)"/></g>
          <g class="fol" transform="translate(238 108)"><use href="#leafB" transform="rotate(-38) scale(.75)"/></g>
          <g class="fol" transform="translate(468 108)"><use href="#leafB" transform="rotate(26) scale(.75)"/></g>
          <g class="fol" transform="translate(202 176)"><use href="#leafB" transform="rotate(-18) scale(.7)"/></g>
          <g class="fol" transform="translate(498 178)"><use href="#leafB" transform="rotate(18) scale(.7)"/></g>
          <g class="fol" transform="translate(256 254)"><use href="#leafB" transform="rotate(-64) scale(.7)"/></g>
          <g class="fol" transform="translate(432 258)"><use href="#leafB" transform="rotate(60) scale(.7)"/></g>
        </g>

        <!-- 芽簇 -->
        <g id="buds" fill="#a63b5c">
          <g class="bud" transform="translate(320 250)"><use href="#budB"/><use href="#budB" transform="translate(10 -8) scale(.8)"/></g>
          <g class="bud" transform="translate(372 240)"><use href="#budB" transform="rotate(14)"/><use href="#budB" transform="translate(-8 -10) scale(.75)"/></g>
          <g class="bud" transform="translate(262 150)"><use href="#budB" transform="rotate(-10) scale(.85)"/></g>
          <g class="bud" transform="translate(430 152)"><use href="#budB" transform="rotate(18) scale(.85)"/></g>
          <g class="bud" transform="translate(336 148)"><use href="#budB" transform="scale(.9)"/></g>
        </g>

        <!-- 花簇（内→外） -->
        <g id="blooms">
          <g class="blm" transform="translate(322 236)"><use href="#flowerB" transform="scale(1.05)"/><use href="#flowerB" transform="translate(14 6) rotate(20) scale(.8)"/></g>
          <g class="blm" transform="translate(368 226)"><use href="#flowerB" transform="rotate(10) scale(1)"/><use href="#flowerB" transform="translate(-14 4) rotate(-24) scale(.8)"/></g>
          <g class="blm" transform="translate(344 180)"><use href="#flowerB" transform="scale(.95)"/><use href="#flowerB" transform="translate(16 -2) rotate(30) scale(.75)"/></g>
          <g class="blm" transform="translate(262 150)"><use href="#flowerB" transform="scale(.9)"/><use href="#flowerB" transform="translate(14 8) rotate(16) scale(.7)"/></g>
          <g class="blm" transform="translate(424 158)"><use href="#flowerB" transform="rotate(14) scale(.9)"/><use href="#flowerB" transform="translate(-12 10) rotate(-18) scale(.7)"/></g>
          <g class="blm" transform="translate(234 104)"><use href="#flowerB" transform="scale(.8)"/></g>
          <g class="blm" transform="translate(464 108)"><use href="#flowerB" transform="rotate(-12) scale(.8)"/></g>
        </g>
      </g>

      <!-- 飞花 / 落雪层 -->
      <g id="particles"></g>
    </svg>

    <div class="note-card" id="noteCard">
      <div class="nc-term"><span class="t-name" id="ncName">—</span><span class="t-date" id="ncDate"></span></div>

/* ═══════════════ 剧场引擎 ═══════════════ */
(function theater(){
  const $ = s => document.querySelector(s);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const fol   = [...document.querySelectorAll("#foliage .fol")];
  const blms  = [...document.querySelectorAll("#blooms .blm")];
  const buds  = [...document.querySelectorAll("#buds .bud")];
  const skyTop= $("#skyTop"), skyBot = $("#skyBot"), ground = $("#ground");
  const stage = $("#stage"), particles = $("#particles");

  /* 状态：当前参数值（数值逐帧补间） */
  const cur = {leaf:0,bud:0,bloom:0, skyTop:"#e2e5de", skyBot:"#edeee6", ground:"#d8d4c2"};
  let from = null, to = null, t0 = 0, TWEEN_MS = 1100;
  let termIdx = 0;

  const hex2rgb = h => [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const rgb2hex = c => "#" + c.map(v=>Math.round(v).toString(16).padStart(2,"0")).join("");
  const mix = (a,b,k)=>rgb2hex(hex2rgb(a).map((v,i)=>v+(hex2rgb(b)[i]-v)*k));
  const ease = k => k<.5 ? 2*k*k : 1-((-2*k+2)**2)/2;

  function applyState(leaf,bud,bloom,sT,sB,g){
    const setN = (groups,n)=>{ // 内→外逐簇显现，边界簇用透明度过渡
      const total = groups.length;
      const f = n*total;
      const full = Math.floor(f), frac = f-full;
      groups.forEach((gEl,i)=>{
        if(i<full) gEl.style.opacity = 1;
        else if(i===full && frac>0) gEl.style.opacity = frac.toFixed(2);
        else gEl.style.opacity = 0;
      });
    };
    setN(fol,leaf); setN(buds,bud); setN(blms,bloom);
    skyTop.setAttribute("stop-color",sT);
    skyBot.setAttribute("stop-color",sB);
    ground.setAttribute("fill",g);
    return {leaf,bud,bloom};
  }

  /* 粒子：飞花 / 落雪 */
  const svgNS = "http://www.w3.org/2000/svg";
  let lastSpawn = 0;
  function spawn(bloomDelta, snowing){
    const now = performance.now();
    if(now - lastSpawn < 260) return;
    lastSpawn = now;
    const el = document.createElementNS(svgNS, snowing ? "circle" : "path");
    if(snowing){
      el.setAttribute("r", (1.2+Math.random()*1.6).toFixed(1));
      el.setAttribute("fill","rgba(255,255,255,.85)");
    } else {
      el.setAttribute("d","M0 0 C -2 -10, -4 -16, -7 -22 Q -9.5 -27 -6 -28.5 Q 0 -31 6 -28.5 Q 9.5 -27 7 -22 C 4 -16, 2 -10, 0 0 Z");
      el.setAttribute("fill", Math.random()<.5?"#b34a75":"#c2618a");
      el.setAttribute("transform","scale(.55)");
    }
    const x = 60 + Math.random()*560;
    particles.appendChild(el);
    const y0 = 30 + Math.random()*120, dur = 3800+Math.random()*2600, s0 = now;
    (function step(nw){
      const k = (nw - s0)/dur;
      if(k>=1){ el.remove(); return; }
      const y = y0 + k*420, xk = x + Math.sin(k*5+1)*30*(snowing?.5:1);
      if(snowing){ el.setAttribute("cx",xk); el.setAttribute("cy",y); }
      else el.setAttribute("transform",`translate(${xk.toFixed(1)} ${y.toFixed(1)}) rotate(${(k*160)%360}) scale(${(.55*(1-k*.4)).toFixed(2)})`);
      el.setAttribute("opacity",(1-k).toFixed(2));
      requestAnimationFrame(step);
    })(s0);
  }

  let snowNow = false;
  function ambient(now){
    const t = TERMS[termIdx];
    if(!reduced && to === null){
      // 静止时：花期自然落花 / 落雪
      if(t.雪 && Math.random()<.02) spawn(0,true);
      else if(t.bloom>.2 && Math.random()<.015) spawn(0,false);
    }
    requestAnimationFrame(ambient);
  }
  requestAnimationFrame(ambient);

  /* 面板 */
  function paintPanel(i){
    const t = TERMS[i];
    $("#ncName").textContent = t.名;
    const nx = TERMS[(i+1)%24];
    $("#ncDate").textContent = `约 ${t.m}月${t.d}日 – ${nx.m}月${nx.d}日`;
    $("#ncObserve").textContent = t.观;
    $("#ncDo").innerHTML = `<b>可为</b>${t.为}`;
    const poemEl = $("#ncPoem");
    if(t.诗){
      $("#ncPoemLines").innerHTML = t.诗.句.join("<br>");
      $("#ncPoemAuthor").textContent = `${t.诗.代} · ${t.诗.人}《${t.诗.题}》`;
      poemEl.style.display = "";
      requestAnimationFrame(()=>poemEl.classList.add("show"));
    } else {
      poemEl.classList.remove("show");
      poemEl.style.display = "none";
    }
    $("#dialProgress").textContent = `第 ${i+1} / 24 气 · ${t.名}`;
    document.querySelectorAll(".dial-tick").forEach((el,j)=>el.classList.toggle("cur", j===i));
    $("#dialTrack").setAttribute("aria-valuenow", i+1);
    $("#dialTrack").setAttribute("aria-valuetext", t.名);
    snowNow = !!t.雪;
  }

  /* 切换节气（带补间） */
  function goTerm(i, instant){
    i = ((i%24)+24)%24;
    termIdx = i;
    const t = TERMS[i];
    const target = {leaf:t.leaf,bud:t.bud,bloom:t.bloom, skyTop:t.sky[0], skyBot:t.sky[1], ground:t.g};
    paintPanel(i);
    if(instant || reduced){
      from = null; to = null;
      applyState(target.leaf,target.bud,target.bloom,target.skyTop,target.skyBot,target.ground);
      cur.leaf=target.leaf; cur.bud=target.bud; cur.bloom=target.bloom;
      return;
    }
    from = {...cur}; to = target; t0 = performance.now();
    const spanBloom = from.bloom - to.bloom;
    (function tween(now){
      if(!to) return;
      const k = Math.min((now-t0)/TWEEN_MS, 1), e = ease(k);
      const leaf  = from.leaf  + (to.leaf -from.leaf )*e;
      const bud   = from.bud   + (to.bud  -from.bud  )*e;
      const bloom = from.bloom + (to.bloom-from.bloom)*e;
      const sT = mix(from.skyTop,to.skyTop,e), sB = mix(from.skyBot,to.skyBot,e), g = mix(from.ground,to.ground,e);
      applyState(leaf,bud,bloom,sT,sB,g);
      cur.leaf=leaf; cur.bud=bud; cur.bloom=bloom;
      if(spanBloom>0.08 && Math.random()<.12) spawn(0,false);
      if(k<1) requestAnimationFrame(tween);
      else { to = null; }
    })(t0);
  }

  /* 日晷 UI */
  const track = $("#dialTrack"), ticks = $("#dialTicks"), sun = $("#dialSun");
  TERMS.forEach((t,i)=>{
    const el = document.createElement("div");
    el.className = "dial-tick" + (i%2 ? "" : " major");
    el.style.left = (i/23*100) + "%";
    el.innerHTML = `<span class="t-label ${i%2?"duo":""}">${t.名}</span>`;
    el.addEventListener("click", e=>{ e.stopPropagation(); stopPlay(); goTerm(i); });
    ticks.appendChild(el);
  });
  function placeSun(i){ sun.style.left = (i/23*100)+"%"; }
  function trackIndexFromEvent(ev){
    const r = track.getBoundingClientRect();
    const k = Math.min(Math.max((ev.clientX - r.left)/r.width, 0), 1);
    return Math.round(k*23);
  }
  let dragging = false;
  track.addEventListener("pointerdown", ev=>{
    stopPlay(); dragging = true;
    try{ track.setPointerCapture(ev.pointerId); }catch(_){/* 指针已释放时忽略 */}
    const i = trackIndexFromEvent(ev); placeSun(i); goTerm(i);
  });
  track.addEventListener("pointermove", ev=>{
    if(!dragging) return;
    const i = trackIndexFromEvent(ev); placeSun(i); goTerm(i);
  });
  track.addEventListener("pointerup", ()=> dragging=false);
  track.addEventListener("pointercancel", ()=> dragging=false);
  track.addEventListener("keydown", ev=>{
    if(ev.key==="ArrowRight"){ ev.preventDefault(); stopPlay(); goTerm(termIdx+1); placeSun(termIdx); }
    if(ev.key==="ArrowLeft"){  ev.preventDefault(); stopPlay(); goTerm(termIdx-1); placeSun(termIdx); }
    if(ev.key==="Home"){ ev.preventDefault(); stopPlay(); goTerm(0); placeSun(0); }
    if(ev.key==="End"){  ev.preventDefault(); stopPlay(); goTerm(23); placeSun(23); }
  });

  /* 滚轮微调（在舞台上） */
  let wheelLock = 0;
  stage.addEventListener("wheel", ev=>{
    const now = performance.now();
    if(now - wheelLock < 220) return;
    if(Math.abs(ev.deltaY) < 8) return;
    ev.preventDefault();
    wheelLock = now;
    stopPlay();
    goTerm(termIdx + (ev.deltaY>0?1:-1));
    placeSun(termIdx);
  },{passive:false});

  /* 播放 */
  let playTimer = null;
  const btnPlay = $("#btnPlay");
  function stopPlay(){
    if(playTimer){ clearInterval(playTimer); playTimer=null; btnPlay.textContent="转一年"; }
  }
  btnPlay.addEventListener("click", ()=>{
    if(playTimer){ stopPlay(); return; }
    btnPlay.textContent = "暂停";
    playTimer = setInterval(()=>{
      goTerm(termIdx+1);
      placeSun(termIdx);
    }, 1600);
    goTerm(termIdx+1); placeSun(termIdx);
  });
  $("#btnPrev").addEventListener("click", ()=>{ stopPlay(); goTerm(termIdx-1); placeSun(termIdx); });
  $("#btnNext").addEventListener("click", ()=>{ stopPlay(); goTerm(termIdx+1); placeSun(termIdx); });
  $("#btnToday").addEventListener("click", ()=>{ stopPlay(); const i=todayIndex(); goTerm(i); placeSun(i); });

  /* 今日节气：取「开始日期 ≤ 今天」的最后一个节气；1 月初（元旦至小寒前）仍属去年冬至段 */
  function todayIndex(){
    const d = new Date(), val = (d.getMonth()+1)*100 + d.getDate();
    let best = -1, bestVal = -1;
    for(let i=0;i<24;i++){
      const v = TERMS[i].m*100 + TERMS[i].d;
      if(v <= val && v > bestVal){ bestVal = v; best = i; }
    }
    return best === -1 ? 21 : best;   // 1/1–1/4 → 冬至段
  }

  /* 幕后册页 */
  const bs = $("#backstage"), scrim = $("#scrim");
  function openBS(){ bs.classList.add("on"); scrim.classList.add("on"); bs.setAttribute("aria-hidden","false"); }
  function closeBS(){ bs.classList.remove("on"); scrim.classList.remove("on"); bs.setAttribute("aria-hidden","true"); }
  $("#btnBackstage").addEventListener("click", openBS);
  $("#btnCloseBackstage").addEventListener("click", closeBS);
  scrim.addEventListener("click", closeBS);
  window.addEventListener("keydown", e=>{ if(e.key==="Escape") closeBS(); });

  /* 初始化：定位到今日 */
  const i0 = todayIndex();
  placeSun(i0);
  goTerm(i0, true);
})();
</script>
</body>
</html>
